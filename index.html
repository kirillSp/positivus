<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positivus</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/main.js" type="module" defer></script>
</head>
<body>
    <header class="header" data-js-header>
        <div class="header__body">
           
            <div class="header__body-inner container">
                <a href="#" class="header__logo logo" aria-label="Home">
                    <img    
                        src="/images/logo.svg" 
                        class="logo__image"
                        width="220" height="36"
                        loading="lazy"
                        alt="positivus logo"
                    />
                </a>
    
                <div 
                    class="header__overlay"
                    data-js-header-overlay
                >
    
                    <nav class="header__menu">
                        <ul class="header__menu-list">
                            <li class="header__menu-item">
                                <a 
                                    href="#" 
                                    class="header__menu-link"
                                >
                                    About us
                                </a>
                            </li>
                            <li class="header__menu-item">
                                <a 
                                    href="#" 
                                    class="header__menu-link"
                                >
                                    Services
                                </a>
                            </li>
                            <li class="header__menu-item">
                                <a 
                                    href="#" 
                                    class="header__menu-link"
                                >
                                    Use Cases
                                </a>
                            
                            </li>
                            <li class="header__menu-item">
                                <a 
                                    href="#" 
                                    class="header__menu-link"
                                >
                                    Pricing
                                </a>
            
                            </li>
                            <li class="header__menu-item">
                                <a 
                                    href="#" 
                                    class="header__menu-link"
                                >
                                    Blog
                                </a>
                            </li>
                        </ul>
                    </nav>

                    <button 
                        class="header__button button button--transparent"
                        type="button"
                    >
                        Request a quote
                    </button>
    
                </div>
    
                <button 
                    class="header__burger-button burger-button visible-mobile"
                    type="button"
                    aria-label="Open menu"
                    title="Open menu"
                    data-js-header-burger-button
                >
                    <span class="burger-button__line"></span>
                    <span class="burger-button__line"></span>
                    <span class="burger-button__line"></span>
                </button>
            </div>

        </div>
    </header>
</body>
</html>
